name: Metrics Guardrails

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-assess:
    name: Lint + Assess
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Perl
        uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.34'

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run size regression lint
        # Warns on:
        #   - New .pm file over 1000 lines (Architecture rubric)
        #   - New sub over 200 lines (Method Quality rubric)
        #   - New bare die outside eval/or die/$SIG (Error Handling)
        #   - New use JSON::PP without empty-import workaround (Code Hygiene)
        #   - New use NonCore::Module (Dependencies)
        # Always exits 0 - PR author must address warnings in review.
        run: |
          perl tools/lint_size_regression.pl --base=origin/${{ github.base_ref }}

      - name: Run codebase assessment
        # CI runs the assessment in --skip-tests mode to avoid the
        # 3+ minute test runner invocation. Tests are run separately
        # by the release workflow; in CI the Testing category uses
        # last-known-good counts from the assessment history (or the
        # runner output if available). The assessment itself finishes
        # in under 10 seconds without tests.
        id: assess
        run: |
          perl -I lib tools/assess_codebase.pl --skip-tests --json > /tmp/assess.json
          python3 -c "
          import json
          with open('/tmp/assess.json') as f:
              d = json.load(f)
          s = d['scores']
          print(f\"::notice title=CLIO Codebase Score::weighted={d['weighted_total']}/10\")
          for cat, score in sorted(s.items()):
              print(f\"::notice title={cat}::{score}/10\")
          "

      - name: Compare against previous assessment
        # If runs/assessment-history.jsonl has a previous entry, diff.
        # Comment on PR if any score regressed.
        run: |
          if [ ! -f runs/assessment-history.jsonl ]; then
            echo "No assessment history yet - skipping comparison"
            exit 0
          fi

          # Get last 2 records, compare scores
          python3 - <<'PYEOF'
          import json
          with open('runs/assessment-history.jsonl') as f:
              lines = [json.loads(l) for l in f if l.strip()]
          if len(lines) < 2:
              print("Not enough history for comparison")
              exit(0)
          prev = lines[-2]
          curr = lines[-1]
          regressions = []
          for cat, score in curr['scores'].items():
              prev_score = prev['scores'].get(cat, score)
              if score < prev_score:
                  regressions.append((cat, prev_score, score))
          if regressions:
              print("::error::Metrics regression detected:")
              for cat, p, c in regressions:
                  print(f"  {cat}: {p} -> {c}")
              exit(0)
          else:
              print("::notice::No metric regressions")
          PYEOF

      - name: Append assessment to history
        if: github.event_name == 'push'
        run: |
          perl -I lib tools/assess_codebase.pl --skip-tests --json > /tmp/assess.json
          python3 -c "
          import json, datetime
          with open('/tmp/assess.json') as f:
              record = json.load(f)
          record['timestamp'] = datetime.datetime.utcnow().isoformat() + 'Z'
          record['commit'] = '${{ github.sha }}'
          record['note'] = 'CI push event'
          with open('runs/assessment-history.jsonl', 'a') as f:
              f.write(json.dumps(record) + '\n')
          "
          git config user.name 'CLIO Metrics CI'
          git config user.email 'metrics@syntheticautonomicmind.org'
          git add runs/assessment-history.jsonl
          git diff --cached --quiet || git commit -m 'metrics: append assessment history'
          git push